name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Target current repository
        env:
          REPOSITORY_SLUG: ${{ github.repository }}
        run: |
          organization="${REPOSITORY_SLUG%%/*}"
          repository="${REPOSITORY_SLUG#*/}"
          jq \
            --arg organization "$organization" \
            --arg repository "$repository" \
            '.organization = $organization | .repository = $repository' \
            .github/issue-management/config.json > "$RUNNER_TEMP/issue-policy-config.json"
          mv "$RUNNER_TEMP/issue-policy-config.json" .github/issue-management/config.json
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr
