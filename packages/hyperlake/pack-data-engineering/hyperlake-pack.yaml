apiVersion: packs.hyperlake.cloud/v1alpha1
kind: SuperHarnessPack
metadata:
  id: data-engineering
  version: 0.1.0
  category: capability
  name: Data Engineering
  description: Governed data discovery, modeling, transformation, quality, lineage, observability, and delivery procedures across provisioned and connected resources.
requires:
  capabilities:
    - governed-data-access
    - metadata-discovery
provides:
  - data-modeling
  - transformation-planning
  - pipeline-investigation
  - data-quality-verification
outcomes:
  - id: data-modeling
    name: Model governed data
    description: Design bronze, silver, and serving-layer models against authorized customer resources.
  - id: transformation-planning
    name: Plan transformations
    description: Produce deterministic transformation plans using attached SQL, dbt, repository, and workflow tools.
  - id: pipeline-investigation
    name: Investigate pipelines
    description: Trace failed or stale pipelines through metadata, lineage, logs, and orchestrator state.
  - id: data-quality-verification
    name: Verify data quality
    description: Run checks and evaluations that prove expected schemas, freshness, and business constraints.
resourceSlots:
  - id: data-environment
    types: [hyperlake-query-resource, governed-data-environment]
    required: true
    description: Governed customer data environment used for discovery, query execution, and policy enforcement.
  - id: transformation-project
    types: [dbt-project, sql-repository, git-repository, local-directory]
    required: false
    description: Optional customer transformation project; dbt is supported as one provider rather than required by the capability.
  - id: definition-repository
    types: [git-repository, local-directory]
    required: false
    description: Customer-controlled repository containing data definitions, contracts, and deployment artifacts.
  - id: orchestrator
    types: [temporal, prefect, workflow-service]
    required: false
    description: Optional workflow system for deterministic execution, retries, approvals, and verification.
  - id: semantic-project
    types: [semantic-model-project]
    required: false
    description: Optional governed semantic project used for natural-language query generation and metric definitions.
  - id: monitor
    types: [hyperlake-monitor]
    required: false
    description: Optional scheduled monitor used for freshness, quality, observability, or policy verification.
assets:
  - id: silver-orders-ddl
    type: ddl
    path: assets/ddl/silver_orders.sql
    description: Portable example DDL for a typed and deduplicated silver orders table.
    dialect: ansi-sql
    adapters: [hyperlake, databricks]
    portable: true
    access: mutate
    approval: required
  - id: build-silver-layer
    type: routine
    path: assets/routines/build_silver_layer.yaml
    description: Governed procedure for inspecting, proposing, applying, and verifying a silver-layer model.
    access: mutate
    approval: required
  - id: maintain-data-freshness
    type: goal
    path: assets/goals/maintain_data_freshness.yaml
    description: Goal template with deterministic freshness success criteria.
  - id: sql-safety-evaluation
    type: evaluation
    path: assets/evaluations/sql_safety.yaml
    description: Evaluation requiring adapter compatibility, read-only inspection, approval for mutation, and post-action verification.
  - id: data-engineering-skill
    type: reference
    path: skills/data-engineering/SKILL.md
    description: Full operating guidance for governed data-engineering tasks.
