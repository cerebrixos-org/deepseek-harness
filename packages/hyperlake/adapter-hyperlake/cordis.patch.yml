# Register this package in the pack catalog and connect the unchanged Hyperlake
# CLI MCP server. Authentication remains in the existing CLI configuration.
- insert:
    - id: superharness-adapter-hyperlake-pack
      name: '@hyperlake/superharness-adapter-hyperlake'

    - id: superharness-hyperlake-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      disabled: !!js process.env.SUPERHARNESS_HYPERLAKE_DISABLED === '1'
      config:
        serverName: hyperlake
        transport: stdio
        command: !!js process.env.SUPERHARNESS_HYPERLAKE_COMMAND || 'hyperlake'
        args:
          - mcp
          - serve
          - --stdio
          - --mode
          - !!js process.env.SUPERHARNESS_HYPERLAKE_MODE || 'analyst'
        failOnStartupError: true
        toolCallTimeoutMs: 120000
